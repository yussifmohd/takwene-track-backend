name: backend-tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore TrackManagement.slnx --locked-mode

      - name: Build
        run: dotnet build TrackManagement.slnx -c Release --no-restore

      - name: Test (TRX + Cobertura coverage)
        run: >
          dotnet test --solution TrackManagement.slnx -c Release --no-build
          --results-directory TestResults
          --report-trx
          --coverlet --coverlet-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
          if-no-files-found: warn
